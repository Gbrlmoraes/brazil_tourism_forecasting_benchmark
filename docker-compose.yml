services:
  mlflow:
    # keep in sync with the `mlflow` version in pyproject.toml (client and server
    # must agree on the database schema)
    image: ghcr.io/mlflow/mlflow:v3.13.0
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      # tracking/registry database (mlflow.db) and served artifacts (artifacts/)
      - ${MLFLOW_DATA_DIR:-./mlflow_data}:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped
