[project]
name = "brazil-tourism-forecasting-benchmark"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pandas[parquet]>=3.0.2",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'LOG', 'TD', 'PD']

[tool.ruff.format]
preview = true
quote-style = 'single'

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]
