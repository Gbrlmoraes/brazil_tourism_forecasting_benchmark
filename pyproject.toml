[project]
name = "brazil-tourism-forecasting-benchmark"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pandas[parquet]>=3.0.2",
    "pmdarima>=2.1.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.67.3",
]

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'LOG', 'TD', 'PD']

[tool.ruff.format]
preview = true
quote-style = 'single'

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
pre_lint = 'ruff format'
lint = 'ruff check --fix'